<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Crypto Mining & Auto-Withdraw</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { color: #38bdf8; }
        .balance-card {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        button {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        button:hover { background: #16a34a; }
        .withdraw-btn { background: #eab308; color: #000; }
        .withdraw-btn:hover { background: #ca8a04; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚀 Private Crypto Miner</h2>
        <p>Admin Exclusive Bot</p>

        <div class="balance-card">
            <h3>Mined Balance</h3>
            <p id="balance">0.00015000 BTC</p>
        </div>

        <button onclick="startMining()">Start Mining</button>
        <button class="withdraw-btn" onclick="withdrawToBinance()">Auto-Withdraw to Binance</button>
        
        <p id="status" style="margin-top: 15px; font-size: 14px; color: #94a3b8;"></p>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentBalance = 0.00015000;

        function startMining() {
            document.getElementById("status").innerText = "Mining in progress...";
            setTimeout(() => {
                currentBalance += 0.00005000;
                document.getElementById("balance").innerText = currentBalance.toFixed(8) + " BTC";
                document.getElementById("status").innerText = "Mining completed successfully!";
            }, 2000);
        }

        function withdrawToBinance() {
            document.getElementById("status").innerText = "Processing Binance Auto-Withdrawal...";
            
            fetch('/api/withdraw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ coin: 'BTC', amount: currentBalance, userId: tg.initDataUnsafe?.user?.id || 'admin' })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    document.getElementById("status").innerText = "Successfully withdrawn to Binance!";
                    currentBalance = 0;
                    document.getElementById("balance").innerText = "0.00000000 BTC";
                } else {
                    document.getElementById("status").innerText = "Withdrawal Failed: " + (data.error || 'Unknown error');
                }
            })
            .catch(err => {
                document.getElementById("status").innerText = "Connection Error!";
            });
        }
    </script>
</body>
</html>
